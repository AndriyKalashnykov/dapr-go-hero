apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: inventory-subscriptions
  namespace: dapr-go-hero-inventory
spec:
  pubsubname: pubsub
  topic: inventory
  routes:
    rules:
      - match: event.type == "widget.v1"
        path: /widgets.v1
      - match: event.type == "gadget.v1"
        path: /gadgets.v1
    default: /products.v1
scopes:
  - inventory
