apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: inventory-resiliency
  namespace: dapr-go-hero-inventory
spec:
  policies:
    timeouts:
      service-invocation: 10s
      state-operation: 5s
    retries:
      state-retry:
        policy: exponential
        duration: 100ms
        maxInterval: 5s
        maxRetries: 3
      pubsub-retry:
        policy: constant
        duration: 1s
        maxRetries: 5
      pubsub-inbound-retry:
        # Targets component-level inbound retries on pub/sub consumption.
        # Note: in Dapr 1.17 with pubsub.redis v1, this policy does NOT
        # retry handler-error NACKs — those are effectively ACKed by the
        # sidecar. The policy is still declared so other brokers that
        # respect component-level inbound retry (e.g., Kafka, RabbitMQ)
        # pick it up if the component type is swapped.
        policy: exponential
        duration: 500ms
        maxInterval: 2s
        maxRetries: -1
      service-retry:
        policy: exponential
        duration: 200ms
        maxInterval: 10s
        maxRetries: 3
    circuitBreakers:
      products-cb:
        maxRequests: 1
        timeout: 10s
        trip: consecutiveFailures >= 5
  targets:
    apps:
      products:
        timeout: service-invocation
        retry: service-retry
        circuitBreaker: products-cb
    components:
      statestore:
        outbound:
          timeout: state-operation
          retry: state-retry
      pubsub:
        outbound:
          retry: pubsub-retry
        inbound:
          retry: pubsub-inbound-retry
scopes:
  - inventory
