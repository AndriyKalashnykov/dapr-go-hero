apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: dapr-go-hero-inventory
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis.dapr-go-hero.svc.cluster.local:6379"
    - name: redisPassword
      value: ""
    # At-least-once redelivery tuning (Redis Streams, consumer groups).
    # processingTimeout: how long a claimed message may be held before
    # Dapr XCLAIMs it back from the consumer-group PEL. This governs
    # *consumer-death* redelivery only — handler-error NACKs are ACKed
    # by the sidecar in Dapr 1.17 pubsub.redis v1. For production
    # workloads with longer legitimate handler runtimes, raise this.
    - name: processingTimeout
      value: "10s"
    # redeliverInterval: frequency of scanning pending entries for
    # messages that exceeded processingTimeout.
    - name: redeliverInterval
      value: "5s"
    - name: queueDepth
      value: "100"
