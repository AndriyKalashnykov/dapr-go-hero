apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dapr-go-hero
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS widgets (
      id varchar(256) PRIMARY KEY,
      description varchar(4000) NOT NULL,
      price float NOT NULL
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dapr-go-hero
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dapr-go-hero
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
