apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: dapr-go-hero-inventory
type: Opaque
stringData:
  host: "postgres.dapr-go-hero.svc.cluster.local:5432"
  username: "postgres"
  password: "postgres"
  database: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: dapr-go-hero-inventory
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "inventory"
        dapr.io/app-port: "3002"
        dapr.io/app-protocol: "http"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/log-as-json: "true"
        dapr.io/sidecar-cpu-request: "50m"
        dapr.io/sidecar-memory-request: "64Mi"
        dapr.io/sidecar-cpu-limit: "200m"
        dapr.io/sidecar-memory-limit: "128Mi"
    spec:
      serviceAccountName: inventory
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: dapr-go-hero/inventory:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: api
              containerPort: 3000
            - name: dapr-http
              containerPort: 3002
          env:
            - name: PUBLIC_API_ADDR
              value: ":3000"
            - name: SDK_HTTP_ADDR
              value: ":3002"
            - name: CUSTOM_HTTP_ADDR
              value: ":3001"
            - name: CUSTOM_GRPC_ADDR
              value: "0.0.0.0:4001"
            - name: SDK_GRPC_ADDR
              value: ":4002"
            - name: PRODUCTS_APP_ID
              value: "products.dapr-go-hero-products"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
