name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  # `changes` is the path-filter detector. It runs on every event and decides
  # whether the rest of the workflow has anything to do. Doc-only changes set
  # outputs.code to 'false', and downstream jobs short-circuit. This shape is
  # Repository-Rulesets-safe: every event creates a workflow run (so the
  # required `ci-pass` aggregator always reports), but only meaningful changes
  # spend CI minutes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # `base` is silently ignored on pull_request events (PR head is the
          # natural base) — set it only on push events so act-based local CI
          # runs (`make ci-run` invokes `act push`) still work.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          filters: |
            code:
              - '!(**.md|docs/**|specs/**|LICENSE|.gitignore|.claudeignore|.claude/**|benchmarks/**|**.png|**.jpg|**.gif|**.svg)'
              - 'CLAUDE.md'
            e2e:
              - 'cmd/**'
              - 'pkg/**'
              - 'proto/**'
              - 'k8s/**'
              - 'tests/**'
              - 'components/**'
              - 'Dockerfile.*'
              - 'Makefile'
              - '.mise.toml'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  static-check:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Static check
        run: make static-check

  build:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Build
        run: make build

  test:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Test
        run: make test

  integration-test:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Test
        run: make integration-test

  # Build container images locally and Trivy-scan them. The project doesn't
  # publish images today (see CLAUDE.md), so this is a pre-push quality gate
  # only — it catches CVEs in the alpine base layer or our own files before
  # they regress.
  docker:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Build
        run: make docker-build

      - name: Scan inventory image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dapr-go-hero/inventory:dev
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan products image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dapr-go-hero/products:dev
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  e2e:
    needs: [changes, build, test]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'run-e2e')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Set up KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.31.0
          cluster_name: dapr-go-hero
          config: ./kind-config.yaml
          # renovate: datasource=docker depName=kindest/node
          node_image: kindest/node:v1.35.1

      - name: Install Dapr CLI
        # dapr/setup-dapr publishes only `v1`/`v2` tags upstream (no semver). The
        # SHA pin makes `# v2` precise, even though the tag is moving.
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          # renovate: datasource=github-releases depName=dapr/cli
          version: '1.17.1'

      - name: Set up cloud-provider-kind + Dapr runtime
        run: make kind-bootstrap

      - name: Deploy to KinD
        run: make k8s-deploy

      # Runs across all 4 client modes: sdk-http, sdk-grpc, custom-http, custom-grpc.
      - name: Test
        run: make e2e-all

      - name: Debug on failure
        # Best-effort log dump; failures here must not mask the real e2e failure
        # so we run k8s-status which itself tolerates missing namespaces.
        if: failure()
        run: make k8s-status

  ci-pass:
    needs: [changes, static-check, build, test, integration-test, docker, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: always()
    steps:
      - name: Verify all jobs succeeded or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled."
            exit 1
          fi
          echo "All CI jobs passed (or were skipped via path-filter)."
