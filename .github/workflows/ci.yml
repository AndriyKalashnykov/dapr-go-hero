name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Static check
        run: make static-check

  build:
    needs: [static-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  test:
    needs: [static-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  integration-test:
    needs: [static-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Uses Testcontainers to spin a real PostgreSQL
      - name: Integration test
        run: make integration-test

  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfiles
        run: make docker-lint

  e2e:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          cluster_name: dapr-go-hero
          config: ./kind-config.yaml
          node_image: kindest/node:v1.35.1

      - name: Install MetalLB
        run: |
          kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.15.3/config/manifests/metallb-native.yaml
          kubectl rollout status deployment/controller -n metallb-system --timeout=180s
          kubectl rollout status daemonset/speaker -n metallb-system --timeout=180s
          ip_sub=$(docker network inspect kind -f '{{index .IPAM.Config 0 "Subnet"}}' | awk -F. '{printf "%d.%d\n", $1, $2}')
          sed "s/METALLB_IP_SUB/${ip_sub}/g" k8s/metallb-config.yaml | kubectl apply -f -

      - name: Install Dapr
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          # Dapr CLI version (not runtime). CLI v1.17.1 is the latest dapr/cli release.
          # Runtime (sidecar) version is pinned separately in Makefile as DAPR_RUNTIME_VERSION
          # and passed to `dapr init -k --runtime-version`.
          version: '1.17.1'

      - name: Initialize Dapr on cluster
        run: dapr init -k --wait --timeout 300

      - name: Build and load images
        run: |
          make docker-build
          kind load docker-image dapr-go-hero/inventory:dev --name dapr-go-hero
          kind load docker-image dapr-go-hero/products:dev --name dapr-go-hero

      - name: Deploy to KinD
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/zipkin.yaml
          kubectl apply -f k8s/dapr/
          kubectl apply -f k8s/inventory-deployment.yaml
          kubectl apply -f k8s/inventory-service.yaml
          kubectl apply -f k8s/products-deployment.yaml
          kubectl apply -f k8s/products-service.yaml
          kubectl rollout status deployment/redis -n dapr-go-hero --timeout=120s
          kubectl rollout status deployment/postgres -n dapr-go-hero --timeout=120s
          kubectl rollout status deployment/inventory -n dapr-go-hero-inventory --timeout=180s
          kubectl rollout status deployment/products -n dapr-go-hero-products --timeout=180s

      # Runs across all 4 client modes: sdk-http, sdk-grpc, custom-http, custom-grpc
      - name: Run E2E tests
        run: make e2e-all

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A
          echo "=== Inventory logs ==="
          kubectl logs -n dapr-go-hero-inventory -l app=inventory --all-containers --tail=50 || true
          echo "=== Products logs ==="
          kubectl logs -n dapr-go-hero-products -l app=products --all-containers --tail=50 || true

  ci-pass:
    needs: [static-check, docker-lint, build, test, integration-test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."
