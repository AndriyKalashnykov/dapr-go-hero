apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
    # At-least-once redelivery tuning — matches k8s/dapr/pubsub.yaml.
    # Governs consumer-death redelivery (XCLAIM via XPENDING scan); not
    # handler-error redelivery, which Dapr pubsub.redis v1 ACKs anyway.
    - name: processingTimeout
      value: "10s"
    - name: redeliverInterval
      value: "5s"
    - name: queueDepth
      value: "100"
