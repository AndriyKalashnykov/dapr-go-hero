apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
    # At-least-once redelivery tuning — matches k8s/dapr/pubsub.yaml
    # Tight timing so the e2e resiliency test has a deterministic SLO.
    - name: processingTimeout
      value: "10s"
    - name: redeliverInterval
      value: "5s"
    - name: queueDepth
      value: "100"
